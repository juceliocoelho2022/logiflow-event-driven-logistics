name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Testes — ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - pedido-service
          - estoque-service

    defaults:
      run:
        working-directory: ${{ matrix.service }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: ${{ matrix.service }}/pom.xml

      - name: Executar testes
        run: mvn --batch-mode --no-transfer-progress verify

  frontend:
    name: Build — painel-web
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: painel-web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: painel-web/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Gerar build de produção
        run: npm run build

  containers:
    name: Validar Docker Compose
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validar configuração
        run: docker compose config --quiet

      - name: Construir imagens
        run: docker compose build
