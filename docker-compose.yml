services:
  kafka:
    image: apache/kafka:3.9.1
    hostname: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:29093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:29092 --list"]
      interval: 10s
      timeout: 10s
      retries: 12

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: logiflow-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      kafka:
        condition: service_healthy

  pedido-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pedidos
      POSTGRES_USER: logiflow
      POSTGRES_PASSWORD: logiflow
    ports:
      - "5435:5432"
    volumes:
      - pedido_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U logiflow -d pedidos"]
      interval: 5s
      timeout: 5s
      retries: 12

  estoque-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: estoque
      POSTGRES_USER: logiflow
      POSTGRES_PASSWORD: logiflow
    ports:
      - "5436:5432"
    volumes:
      - estoque_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U logiflow -d estoque"]
      interval: 5s
      timeout: 5s
      retries: 12

  pedido-service:
    build: ./pedido-service
    ports:
      - "8081:8081"
    environment:
      DB_URL: jdbc:postgresql://pedido-db:5432/pedidos
      DB_USER: logiflow
      DB_PASSWORD: logiflow
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      pedido-db:
        condition: service_healthy
      kafka:
        condition: service_healthy

  estoque-service:
    build: ./estoque-service
    ports:
      - "8082:8082"
    environment:
      DB_URL: jdbc:postgresql://estoque-db:5432/estoque
      DB_USER: logiflow
      DB_PASSWORD: logiflow
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      estoque-db:
        condition: service_healthy
      kafka:
        condition: service_healthy

  painel-web:
    build: ./painel-web
    ports:
      - "3000:80"
    depends_on:
      - pedido-service
      - estoque-service

volumes:
  pedido_data:
  estoque_data:

